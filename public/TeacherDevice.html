<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Device</title>
    <link rel="stylesheet" href="TeacherDevice.css">
</head>
<body>
    <button id="back-btn" style="
            background: #2196f3;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            ">
            ⬅ Back
            </button>
            
  <h2>Teacher Page - Import Admin Data</h2>

    <!-- Import button -->
    <button id="importBtn">Import Admin Data</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">

     <div class="termShareDiv">
        <!-- Attendance Buttons -->
    <button id="exportAttendanceBtn">Export Attendance</button>
    <input type="file" id="importAttendanceFile" style="display:none" />
    <button id="importAttendanceBtn">Import Attendance</button>

     </div>

<div class="termShareDiv">
    <!-- Teacher: only uses export button -->
    <button id="exportBtn">Export First Term Data</button>

    <!-- Admin: imports and merges -->
    <input type="file" id="importFirstTermFile" style="display:none;">
    <button id="importFirstTermBtn">Import & Merge First Term Data</button>
</div>
<div class="termShareDiv">
    <!-- Teacher: only uses export button -->
    <button id="exportBtn2">Export Second Term Data</button>

    <!-- Admin: imports and merges -->
    <input type="file" id="importsecondTermFile" style="display:none;">
    <button id="importsecondTermBtn">Import & Merge Second Term Data</button>
</div>
<div class="termShareDiv">
    <!-- Teacher: only uses export button -->
    <button id="exportBtn3">Export Third Term Data</button>

    <!-- Admin: imports and merges -->
    <input type="file" id="importthirdTermFile" style="display:none;">
    <button id="importthirdTermBtn">Import & Merge Third Term Data</button>
</div>

  <script type="module" src="attendanceShare.js"></script>
  <script type="module" src="TeacherDevice.js"></script>
  <script type="module" src="TeacherDeviceTerm2.js"></script>
  <script type="module" src="TeacherDeviceTerm3.js"></script>
</body>
</html>
