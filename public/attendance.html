<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Attendance</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { text-align: center; margin-bottom: 20px; }
    .form-section, .list-section {
      background: #fff; padding: 15px; margin-bottom: 20px;
      border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    label { font-weight: bold; display: block; margin-top: 10px; }
    select, button { padding: 8px; margin: 5px 0; }
    ul { list-style: none; padding: 0; }
    li { margin: 5px 0; padding: 6px; background: #f9f9f9; border-radius: 5px; }
    .btn {
      background: #007bff; color: white; border: none;
      padding: 10px 15px; border-radius: 5px; cursor: pointer;
    }
    .btn:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>Class Attendance</h1>

  <div class="form-section">
    <label for="sessionSelect">Session:</label>
    <select id="sessionSelect"></select>

    <label for="classSelect">Class:</label>
    <select id="classSelect"></select>

    <label for="termSelect">Term:</label>
    <select id="termSelect">
      <option value="1">1st Term</option>
      <option value="2">2nd Term</option>
      <option value="3">3rd Term</option>
    </select>

    <button id="loadStudents" class="btn">Load Students</button>
  </div>

  <div class="list-section">
    <h2>Mark Attendance</h2>
    <form id="attendanceForm">
      <ul id="studentList"></ul>
      <button type="submit" class="btn">Save Attendance</button>
    </form>
  </div>

  <script type="module" src="attendance.js"></script>
</body>
</html>
