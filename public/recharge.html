<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Increase</title>
</head>
<body>
    <button id="back-btn" style="
            background: #2196f3;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            ">
            ⬅ Back
            </button>
            
    <h1>View Ad & Earn Gems</h1>
    <p>YOUR GEMS: <span id="gem-count">0</span></p>
    <button id="view-ad-btn">View Ad</button>

    <div id="ad-container">
        <h2>Sponsored Ad</h2>
        <p>This is a sample ad. imagine your real ad here.</p>
        <p>Ad will close in <span id="timer">5</span> seconds...</p>
    </div>

    <p id="reward-msg"></p>

    <script type="module" src="recharge.js"></script>
</body>
</html>
